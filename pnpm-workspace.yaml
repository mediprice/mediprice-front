engineStrict: true
saveExact: true

allowBuilds:
  unrs-resolver: true

# eslint-config-next's bundled plugins (react, import, jsx-a11y) don't declare ESLint 10 yet,
# but their rules were verified to run under it. Remove once they publish ESLint 10 support.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
